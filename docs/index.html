<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>clever</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="toolbar">
    <button id="btn-back" title="back" disabled>&larr;</button>
    <button id="btn-fwd" title="forward" disabled>&rarr;</button>
    <button id="btn-reload" title="reload">&#8635;</button>
    <form id="nav-form" autocomplete="off">
      <input id="address" type="text" placeholder="search or enter a URL" spellcheck="false" />
    </form>
    <button id="btn-go" type="submit" form="nav-form">Go</button>
    <button id="btn-newtab" title="open in a new tab">&#8599;</button>
  </div>

  <div class="viewport">
    <iframe id="frame" title="clever browser"></iframe>
    <div id="blank-hint" class="hint">
      type a URL above and hit Go &mdash; e.g. <a href="#" data-url="https://en.wikipedia.org">en.wikipedia.org</a>,
      <a href="#" data-url="https://news.ycombinator.com">news.ycombinator.com</a>,
      <a href="#" data-url="https://example.com">example.com</a>
      <br /><br />
      <span class="dim">some sites refuse to be shown inside another page (their own security header, not a bug here) &mdash;
      those open in a new tab instead.</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
