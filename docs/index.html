<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>clever</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand"><span class="dot" id="status-dot"></span> clever</div>
    <div class="meta">
      <span>uptime <b id="stat-uptime">0s</b></span>
      <span>instructions <b id="stat-instr">0</b></span>
    </div>
    <a class="gh" href="https://github.com/copy/v86" target="_blank" rel="noopener">powered by v86 (BSD-2)</a>
  </header>

  <main>
    <div id="boot-progress">
      <div>booting linux &mdash; downloading <span id="boot-file">kernel</span>&hellip; <span id="boot-pct">0%</span></div>
      <div class="bar"><div class="fill" id="boot-fill"></div></div>
    </div>

    <div class="terminal-wrap">
      <div id="terminal"></div>
    </div>

    <div class="controls">
      <div class="buttons">
        <button id="btn-restart" disabled>restart</button>
        <button id="btn-pause" disabled>pause</button>
        <button class="danger" id="btn-stop" disabled>stop</button>
      </div>
      <div class="hint">everything runs in <b>this tab</b> &mdash; no server, no account, nothing leaves your browser</div>
    </div>
  </main>

  <footer>
    a real Linux kernel, emulated in WebAssembly, entirely client-side &middot;
    <a href="https://github.com/copy/v86" target="_blank" rel="noopener">v86</a> does the CPU emulation, this page is the wrapper
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="build/libv86.js"></script>
  <script src="app.js"></script>
</body>
</html>
